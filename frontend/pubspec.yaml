name: room_management_app
description: "Ứng dụng quản lý phòng trọ và ki-ốt cá nhân sử dụng Flutter và Firebase"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core & Services
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.4

  # State Management & Architecture
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  uuid: ^4.5.1

  # UI & Utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  share_plus: ^10.1.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
